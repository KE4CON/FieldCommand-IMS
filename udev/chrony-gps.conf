# FieldCommand IMS — GPS as an offline time source for chrony
# Installed to: /etc/chrony/conf.d/fieldcommand-gps.conf
#
# WHY THIS EXISTS
# FieldCommand runs offline, where there is no internet NTP server to set the
# clock. A GPS receiver carries an atomic-clock-derived UTC time, so we feed
# gpsd's time into chrony as a reference clock ("refclock"). The result: the
# Pi holds accurate UTC with no internet at all. When a WAN *is* present, the
# internet time servers in the base chrony.conf are used as well, and chrony
# picks the best source automatically.
#
# HOW IT WORKS
# gpsd (running with -n, so it polls even with no client) writes its time into
# System-V shared-memory (SHM) segments. chrony reads them:
#   * SHM 0 = NMEA time from the GPS sentences (coarse — good to ~0.1 s).
#   * SHM 1 = PPS (pulse-per-second) IF the receiver provides a PPS signal
#             (fine — good to well under a millisecond). Harmless if absent:
#             the segment simply never updates and chrony ignores it.

# GPS NMEA time via gpsd shared memory. The offset compensates for the typical
# lag between the top of the second and when the NMEA sentence is delivered;
# 0.2 s is a safe starting point for USB receivers. Tune per receiver if you
# have PPS to measure against.
refclock SHM 0 refid NMEA precision 1e-1 offset 0.2 delay 0.2

# GPS PPS via gpsd shared memory (only produces samples if the GPS has PPS).
# 'prefer' tells chrony to favor it when it is present because it is far more
# accurate than NMEA; when there is no PPS it produces nothing and is ignored.
refclock SHM 1 refid PPS precision 1e-7 prefer

# Let chrony step the clock (not just slew it) when it is far off — important
# on a cold boot with no RTC/battery, so the clock jumps straight to GPS time
# instead of creeping there over hours. Steps only in the first few updates.
makestep 1.0 3

# Save the disciplined time to disk periodically so a reboot starts close to
# correct even before GPS or a WAN is reacquired.
rtcsync

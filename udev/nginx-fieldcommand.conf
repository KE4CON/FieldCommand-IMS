# FieldCommand nginx site configuration  (HTTPS)
# Install to: /etc/nginx/sites-available/fieldcommand
# Enable with: ln -s /etc/nginx/sites-available/fieldcommand /etc/nginx/sites-enabled/fieldcommand
# Test with:   sudo nginx -t
# Reload with: sudo systemctl reload nginx
#
# TLS certificate is generated by scripts/fc-gen-cert.sh (local-CA by default, or
# --self-signed). On a closed LAN with no public domain, browsers will show a
# one-time trust prompt unless the local-CA root is installed on the device.
#
# The four core services (5050 main/FCC, 5051 health, 5055 ICS, 5056 refs) are
# reached same-origin at /svc/<port>/... so the app works identically over http
# (dev) and https (production) with no mixed-content. The front end no longer
# calls http://host:<port> directly.

# WebSocket upgrade helper (used by the live APRS feed proxies below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # Everything is served over TLS; send all plain-HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

# ── Main HTTPS site ────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/fieldcommand/tls/server.crt;
    ssl_certificate_key /etc/fieldcommand/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:FC_TLS:4m;
    ssl_session_timeout 1h;
    # NOTE: deliberately NO Strict-Transport-Security (HSTS). With a self-signed
    # or local-CA certificate, HSTS would prevent the browser's one-time
    # click-through and lock operators out of the LAN appliance.

    # ── Web frontend ──────────────────────────────────────────────────────
    root /opt/fieldcommand/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Static asset caching (CSS, JS, images, fonts)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|avif|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ── Core service proxies (same-origin) ────────────────────────────────
    # /svc/<port>/<path>  ->  http://127.0.0.1:<port>/<path>
    # The trailing slash on proxy_pass strips the /svc/<port>/ prefix, so the
    # backend sees exactly the path the front end used to call directly.
    location /svc/5050/ {   # main API / FCC lookup / QR / ID cards
        proxy_pass         http://127.0.0.1:5050/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60;
        client_max_body_size 20M;   # member photos, logos
    }
    location /svc/5051/ {   # health monitor
        proxy_pass         http://127.0.0.1:5051/;
        proxy_set_header   Host $host;
        proxy_read_timeout 10;
    }
    location /svc/5055/ {   # ICS platform
        proxy_pass         http://127.0.0.1:5055/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30;
    }
    location /svc/5056/ {   # reference library (large uploads)
        proxy_pass            http://127.0.0.1:5056/;
        proxy_set_header      Host $host;
        proxy_read_timeout    120;
        client_max_body_size  200M;
    }

    # ── Offline map tiles (port 8083) ─────────────────────────────────────
    # No trailing slash on proxy_pass: preserve the full /tiles/<set>/<z>/<x>/<y>
    # path, which is what the tile server serves.
    location /tiles/ {
        proxy_pass         http://127.0.0.1:8083;
        proxy_set_header   Host $host;
        proxy_read_timeout 10;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Pat Winlink backup client (port 8090) ─────────────────────────────
    location /winlink/ {
        proxy_pass         http://127.0.0.1:8090/;
        proxy_set_header   Host $host;
        proxy_read_timeout 60;
    }

    # ── Kiwix offline library (port 8081) ─────────────────────────────────
    location /kiwix/ {
        proxy_pass         http://127.0.0.1:8081/;
        proxy_set_header   Host $host;
        proxy_read_timeout 30;
    }

    # ── Live APRS tactical feed (same-origin, TLS-terminated) ─────────────
    # The tactical map fetches /aprs-gw/... and opens wss:// here; nginx
    # terminates TLS for the browser and makes the plain-HTTP / ws hop to the
    # APRS RF feed server-side. The upstream defaults to the RF source (APRS
    # Command, or a KISS bridge) on port 8080 on THIS server; if it runs on
    # another host (e.g. the ops laptop), change 127.0.0.1 below to its address.
    location /aprs-gw/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # NOTE: the 44Net gateway tunnel control (port 9001) is intentionally
    # localhost-only on the gateway Pi (a different device) and is not proxied.

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy         "no-referrer" always;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/fieldcommand_access.log;
    error_log  /var/log/nginx/fieldcommand_error.log;
}
